version: 2

models:
  - name: stg_online_retail
    description: "Cleaned and standardised transaction-level data from the UCI Online Retail dataset."

    columns:
      - name: invoice
        description: "Invoice number identifying the transaction."
        data_tests:
          - not_null

      - name: stock_code
        description: "Product stock code."
        data_tests:
          - not_null

      - name: description
        description: "Product description."
        data_tests:
          - not_null

      - name: invoice_date
        description: "Date and time of the transaction."
        data_tests:
          - not_null

      - name: is_cancelled
        description: "Boolean flag indicating whether the invoice is cancelled."

  - name: stg_product_data
    description: "Cleaned and standardised product taxonomy data."

    columns:
      - name: description
        description: "Product description used to identify the product."
        data_tests:
          - not_null

      - name: top_level_category
        description: "Top-level product category."
        data_tests:
          - not_null

      - name: subcategory
        description: "Product subcategory."
        data_tests:
          - not_null

  - name: int_sales_enriched
    description: "Enriched transaction-level data with revenue, date features, and product taxonomy."

    columns:
      - name: invoice
        data_tests:
          - not_null

      - name: revenue
        data_tests:
          - not_null

      - name: order_year
        data_tests:
          - not_null

      - name: order_month
        data_tests:
          - not_null

      - name: top_level_category
        data_tests:
          - not_null

      - name: subcategory
        data_tests:
          - not_null