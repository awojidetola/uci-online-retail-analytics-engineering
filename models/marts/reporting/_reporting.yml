version: 2

models:

  - name: rpt_customer_analytics
    description: "Customer-level reporting model containing customer performance metrics and revenue-based segmentation."
    columns:
      - name: customer_id
        description: "Business identifier for the customer."
        tests:
          - unique
          - not_null

      - name: customer_orders
        description: "Number of completed orders placed by the customer."

      - name: customer_revenue
        description: "Total revenue generated by the customer from completed orders."

      - name: customer_aov
        description: "Average order value for the customer."

      - name: repeat_customer
        description: "Indicates whether the customer placed more than one completed order."

      - name: revenue_quintile
        description: "Customer revenue ranking divided into five approximately equal groups."

      - name: customer_group
        description: "Revenue-based customer grouping, with the highest revenue quintile classified as Top 20% and the remaining customers as Bottom 80%."

  - name: rpt_sales_performance
    description: "Transaction-line reporting model combining sales activity with customer, product, date and customer segmentation attributes."
    columns:
      - name: invoice
        description: "Invoice number identifying the transaction."

      - name: invoice_date
        description: "Date and time associated with the transaction."
        tests:
          - not_null

      - name: customer_id
        description: "Business identifier for the customer. Null where the source transaction has no customer ID."

      - name: country
        description: "Customer country associated with the transaction."

      - name: top_level_category
        description: "Top-level product category."

      - name: subcategory
        description: "Product subcategory."

      - name: quantity
        description: "Quantity recorded for the transaction line."

      - name: unit_price
        description: "Unit price recorded for the transaction line."

      - name: revenue
        description: "Revenue calculated from unit price multiplied by quantity."
        tests:
          - not_null

      - name: is_cancelled
        description: "Indicates whether the invoice is cancelled."

      - name: customer_orders
        description: "Total number of completed orders placed by the customer."

      - name: customer_revenue
        description: "Total revenue generated by the customer from completed orders."

      - name: customer_aov
        description: "Average order value for the customer."

      - name: repeat_customer
        description: "Indicates whether the customer placed more than one completed order."

      - name: customer_group
        description: "Revenue-based customer grouping."

  - name: rpt_geography_timeseries
    description: "Geography and time-series reporting model at country, year and month grain."
    columns:
      - name: country
        description: "Customer country. Null indicates that country information was unavailable."

      - name: order_year
        description: "Year of the transaction."

      - name: order_month
        description: "Month number of the transaction."

      - name: order_month_name
        description: "Month name of the transaction."

      - name: completed_orders
        description: "Number of distinct completed invoices."

      - name: total_revenue
        description: "Total revenue from completed transaction lines."

      - name: total_quantity
        description: "Total quantity from completed transaction lines."

      - name: customers
        description: "Number of distinct customers associated with completed transactions."

      - name: sales_lines
        description: "Number of completed transaction lines."

      - name: cancelled_sales_lines
        description: "Number of cancelled transaction lines."

      - name: cancellation_rate
        description: "Percentage of transaction lines that were cancelled."